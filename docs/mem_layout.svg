<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="'Fira Code','Consolas',monospace">
  <rect width="680" height="320" rx="8" fill="#0d1117"/>
  <text x="340" y="28" fill="#58a6ff" font-size="14" font-weight="bold" text-anchor="middle">Virtual Address Space — Two-Pass Loading</text>

  <!-- Pass 1: Reserve -->
  <text x="30" y="62" fill="#6e7681" font-size="11">Pass 1:</text>
  <text x="30" y="78" fill="#8b949e" font-size="10">mmap(PROT_NONE)</text>
  <rect x="160" y="50" width="480" height="40" rx="4" fill="#1a1a2e" stroke="#6e7681" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="400" y="74" fill="#6e7681" font-size="11" text-anchor="middle">Reserved Region (load_size bytes, no access)</text>

  <!-- Pass 2: MAP_FIXED -->
  <text x="30" y="122" fill="#6e7681" font-size="11">Pass 2:</text>
  <text x="30" y="138" fill="#8b949e" font-size="10">MAP_FIXED</text>

  <!-- Segment 1: R-- -->
  <rect x="160" y="110" width="140" height="60" rx="4" fill="#0d2137" stroke="#4caf50" stroke-width="1.5"/>
  <text x="230" y="132" fill="#4caf50" font-size="11" font-weight="bold" text-anchor="middle">Segment 1</text>
  <text x="230" y="148" fill="#8b949e" font-size="10" text-anchor="middle">R-- (read-only)</text>
  <text x="230" y="162" fill="#6e7681" font-size="9" text-anchor="middle">ELF header + .rodata</text>

  <!-- Segment 2: R-X -->
  <rect x="310" y="110" width="160" height="60" rx="4" fill="#0d2137" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="390" y="132" fill="#ef6c00" font-size="11" font-weight="bold" text-anchor="middle">Segment 2</text>
  <text x="390" y="148" fill="#8b949e" font-size="10" text-anchor="middle">R-X (executable)</text>
  <text x="390" y="162" fill="#6e7681" font-size="9" text-anchor="middle">.text code</text>

  <!-- Segment 3: RW- -->
  <rect x="480" y="110" width="160" height="60" rx="4" fill="#0d2137" stroke="#e53935" stroke-width="1.5"/>
  <text x="560" y="132" fill="#e53935" font-size="11" font-weight="bold" text-anchor="middle">Segment 3</text>
  <text x="560" y="148" fill="#8b949e" font-size="10" text-anchor="middle">RW- (writable)</text>
  <text x="560" y="162" fill="#6e7681" font-size="9" text-anchor="middle">.data + .bss (zeroed)</text>

  <!-- load_bias annotation -->
  <line x1="160" y1="195" x2="160" y2="220" stroke="#58a6ff" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="160" y1="220" x2="400" y2="220" stroke="#58a6ff" stroke-width="1"/>
  <rect x="200" y="208" width="360" height="24" rx="3" fill="#1a1a2e" stroke="#58a6ff" stroke-width="1"/>
  <text x="380" y="224" fill="#58a6ff" font-size="11" text-anchor="middle">load_bias = actual_base − min_vaddr (ASLR offset)</text>

  <!-- Page alignment note -->
  <rect x="160" y="255" width="480" height="48" rx="4" fill="#1a1a2e" stroke="#6e7681" stroke-width="0.8"/>
  <text x="180" y="274" fill="#ffd54f" font-size="10">Why two passes?</text>
  <text x="180" y="290" fill="#8b949e" font-size="10">Single reservation guarantees contiguous address space.</text>
  <text x="180" y="296" fill="#8b949e" font-size="9"> </text>
  <text x="180" y="296" fill="#8b949e" font-size="10">Inter-segment relative offsets stay valid under ASLR.</text>
</svg>
